<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    GreenTrack のロゴマーク（ブラウザタブ用）。
    3本のパスと rotate は src/components/ui/GreenTrackMark.tsx と共通仕様。形を変えるときは両方を同時に更新すること。
    外側の translate/scale は、GreenTrackMark の viewBox (-3.37 -4.45 24.61 24.04) を
    512px タイルの中央 360px 枠に収めるための値（scale = 360 / 24.61）。
    ファビコンは currentColor が効かないため、色はブランドトークン primary-dark (#145236) を直接指定している。
  -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#ffffff"/>
  <g transform="translate(125.30 145.26) scale(14.6282) rotate(-22 9.5 9.5)" fill="#145236">
    <path d="M5,16 L5,8 A2.5,8 0 0 0 2.5,0 A2.5,8 0 0 0 0,8 A2.5,8 0 0 0 2.5,16 Z"/>
    <path d="M12,16 L12,6 A2.5,10 0 0 0 9.5,-4 A2.5,10 0 0 0 7,6 A2.5,10 0 0 0 9.5,16 Z" opacity="0.72"/>
    <path d="M19,16 L19,8 A2.5,8 0 0 0 16.5,0 A2.5,8 0 0 0 14,8 A2.5,8 0 0 0 16.5,16 Z" opacity="0.42"/>
  </g>
</svg>
